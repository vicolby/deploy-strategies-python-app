name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv pip install -e ".[test]"

      - name: Run linters
        run: |
          uv run ruff check app tests
          uv run mypy app

      - name: Run tests with coverage
        run: uv run pytest --cov=app --cov-report=xml -q
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test

      - name: Check coverage threshold
        run: uv run coverage report --fail-under=90

      - name: Check patch coverage
        if: github.event_name == 'pull_request'
        run: uv run diff-cover coverage.xml --fail-under=85

name: Deploy to Stage

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: stage
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - name: Wait for CI to pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha="${{ github.sha }}"
          for i in $(seq 1 90); do
            ci=$(gh run list --commit "$sha" --workflow ci.yml --json status,conclusion -q '.[0] // empty')
            if [ -z "$ci" ]; then echo "CI run not found yet for $sha"; sleep 10; continue; fi
            status=$(echo "$ci" | jq -r '.status')
            conclusion=$(echo "$ci" | jq -r '.conclusion')
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then echo "CI passed for $sha"; exit 0; fi
              echo "::error::CI $conclusion for $sha; aborting deploy"
              exit 1
            fi
            echo "CI status: $status ($conclusion) — waiting..."
            sleep 10
          done
          echo "::error::Timed out waiting for CI on $sha"
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.2.0

      - name: Deploy to Railway Stage
        id: deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up \
            --project 52df3a49-9ae7-46be-9167-af417821d4c1 \
            --environment 09577fcf-d705-4b2f-bdec-f0f0f992c5fc \
            --service python-app \
            --detach \
            --verbose \
            -m "stage deploy: ${{ github.sha }}"
          echo "url=https://python-app-stage.up.railway.app" >> "$GITHUB_OUTPUT"

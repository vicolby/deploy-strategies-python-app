name: Deploy to Dev

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: []
    environment:
      name: dev
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.19.0

      - name: Deploy to Railway Dev
        id: deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up \
            --project 52df3a49-9ae7-46be-9167-af417821d4c1 \
            --environment 334613e1-2078-4005-a1c6-b47098cf62d2 \
            --service a773fc1a-74b3-44ab-b4b2-156faf356185 \
            --detach \
            -m "dev deploy: ${{ github.sha }}"
          echo "url=https://python-app-dev.up.railway.app" >> "$GITHUB_OUTPUT"

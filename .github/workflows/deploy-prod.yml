name: Deploy to Production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  verify-main-branch:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'release') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Verify tag is on main branch
        run: |
          git fetch origin main
          if git branch -r --contains ${{ github.event.workflow_run.head_sha }} | grep -q "origin/main"; then
            echo "✅ Tag ${{ github.event.workflow_run.head_branch }} is on main branch"
          else
            echo "❌ Tag ${{ github.event.workflow_run.head_branch }} is not on main branch"
            exit 1
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: verify-main-branch
    if: ${{ github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'release') }}
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.2.0

      - name: Deploy to Railway Production
        id: deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up \
            --project 52df3a49-9ae7-46be-9167-af417821d4c1 \
            --environment ac9dd647-5560-4009-9466-c8192b20d5a1 \
            --service python-app \
            --detach \
            --verbose \
            -m "prod deploy: ${{ github.event.workflow_run.head_branch }} (${{ github.event.workflow_run.head_sha }})"
          echo "url=https://python-app-prod.up.railway.app" >> "$GITHUB_OUTPUT"
